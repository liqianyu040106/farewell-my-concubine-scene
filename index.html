<script type="module">

const R=(a,b)=>a+Math.random()*(b-a);
function cnv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return [c,c.getContext('2d')];}
function grain(x,w,h,n=3000,a=.05){

function tex(c,rep){const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;

function lowPolyG(g){

    else if(t==='CapsuleGeometry')o.geometry=new THREE.CapsuleGeometry(pp.radius,pp.length,2,6);
    else if(t==='ConeGeometry')o.geometry=new THREE.ConeGeometry(pp.radius,pp.height,6);
    else if(t==='TorusGeometry')o.geometry=new THREE.TorusGeometry(pp.radius,pp.tube,5,10,pp.arc!==undefined?pp.arc:Math.PI*2);

function pCarpet(){const[c,x]=cnv(1024,1024);x.fillStyle='#b85a50';x.fillRect(0,0,1024,1024);
  for(let i=0;i<800;i++){x.fillStyle=`rgba(${Math.random()<.6?'150,60,52':'215,130,110'},${R(.03,.09)})`;
    x.beginPath();x.arc(R(0,1024),R(0,1024),R(15,70),0,7);x.fill();}
  x.shadowColor='rgba(255,215,120,.8)';x.shadowBlur=10;x.strokeStyle='#ffe09a';x.lineWidth=10;x.strokeRect(30,30,964,964);x.shadowBlur=0;

  function rosette(cx,cy,r,rot){x.save();x.translate(cx,cy);x.rotate(rot);

    x.fillStyle='#d6c197';x.beginPath();x.arc(-r*.66,-r*.4,r*.09,0,7);x.fill();

function makeGlassTree(x,z,s,rot,variant){
  const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot||0;island.add(g);
  const blob=(r,px,py,pz,m)=>{const b=sph(r*s,m||treeMats[Math.floor(R(0,5))],10);
    b.position.set(px*s,py*s,pz*s);b.scale.y=.72;g.add(b);};
  if(variant===0){          /* 高柳：修长主干 · 顶部团冠 */
    const trunk=cyl(.13*s,.24*s,6.2*s,treeTeal2,10);trunk.position.set(0,3.1*s,0);trunk.rotation.z=.1;g.add(trunk);
    blob(1.5,0,6.3,0);blob(.8,.9,5.7,.3);blob(.7,-.8,5.9,-.3);blob(.6,.1,7.2,.1);
  }else if(variant===1){    /* 层叠：三层渐收 */
    const trunk=cyl(.15*s,.3*s,3.2*s,treeTeal2,10);trunk.position.set(0,1.6*s,0);g.add(trunk);
    blob(1.55,0,3.1,0);blob(1.15,0,4.5,0);blob(.75,0,5.7,0);
  }else if(variant===2){    /* 斜逸：主干倾斜 · 冠偏一侧 */
    const trunk=cyl(.15*s,.3*s,4.4*s,treeTeal2,10);trunk.position.set(.5*s,2.2*s,0);trunk.rotation.z=-.38;g.add(trunk);
    blob(1.35,1.7,4.6,.2);blob(.95,2.9,4.1,-.3);blob(.7,.6,5.1,.3);
  }else{                    /* 团冠：双球团簇 */
    const trunk=cyl(.16*s,.28*s,4.6*s,treeTeal2,10);trunk.position.set(0,2.3*s,0);trunk.rotation.z=.06;g.add(trunk);
    blob(1.6,0,4.6,0);blob(1.1,.9,4.1,.3);blob(1.0,-.8,4.2,-.4);blob(.85,.2,5.2,.2);}
  return g;}

function pSunsetCloud(){const[c,x]=cnv(1024,512);
  const cols=['255,150,80','255,120,160','190,140,250','255,200,110','110,220,200','255,140,180'];
  /* 大块软雾斑（横向无缝环绕 · 端部缓慢虚化） */
  for(let i=0;i<30;i++){
    const y=R(130,382),w=R(320,620),cx=R(-200,1224);
    const col=cols[Math.floor(R(0,6))];
    for(const dx of[-1024,0,1024]){
      const g=x.createRadialGradient(cx+dx,y,0,cx+dx,y,w/2);
      g.addColorStop(0,`rgba(${col},.3)`);
      g.addColorStop(.5,`rgba(${col},.18)`);
      g.addColorStop(1,`rgba(${col},0)`);
      x.fillStyle=g;x.save();x.translate(cx+dx,y);x.scale(1,.5);
      x.beginPath();x.arc(0,0,w/2,0,7);x.fill();x.restore();}}
  /* 暖色微亮核心 */
  for(let i=0;i<48;i++){
    const y=R(160,352),w=R(180,380),cx=R(-150,1174);
    const col=cols[Math.floor(R(0,6))];
    for(const dx of[-1024,0,1024]){
      const g=x.createRadialGradient(cx+dx,y,0,cx+dx,y,w/2);
      g.addColorStop(0,`rgba(${col},.38)`);
      g.addColorStop(.4,`rgba(${col},.2)`);
      g.addColorStop(1,`rgba(${col},0)`);
      x.fillStyle=g;x.save();x.translate(cx+dx,y);x.scale(1,.38);
      x.beginPath();x.arc(0,0,w/2,0,7);x.fill();x.restore();}}
  /* 上下边缘 + 左右两端淡出（无硬边、端部虚化） */
  x.globalCompositeOperation='destination-out';
  const fg=x.createLinearGradient(0,0,0,512);
  fg.addColorStop(0,'rgba(0,0,0,1)');fg.addColorStop(.2,'rgba(0,0,0,0)');
  fg.addColorStop(.8,'rgba(0,0,0,0)');fg.addColorStop(1,'rgba(0,0,0,1)');
  x.fillStyle=fg;x.fillRect(0,0,1024,512);
  const fg2=x.createLinearGradient(0,0,1024,0);
  fg2.addColorStop(0,'rgba(0,0,0,1)');fg2.addColorStop(.16,'rgba(0,0,0,0)');
  fg2.addColorStop(.84,'rgba(0,0,0,0)');fg2.addColorStop(1,'rgba(0,0,0,1)');
  x.fillStyle=fg2;x.fillRect(0,0,1024,512);
  x.globalCompositeOperation='source-over';
  return tex(c);}

    coreL.intensity=1.1+.5*Math.sin(t*1.6+1);
    weddingFlames.forEach(f2=>{
      const k=Math.sin(t*11+f2.ph);
      f2.fl.scale.set(.72+k*.16,1.7-k*.24,.72);
      f2.fg.material.opacity=.6+.25*Math.sin(t*13+f2.ph);});
    installL.intensity=.75+.3*Math.sin(t*2);
    softBeams.forEach((b2,i)=>{b2.rotation.z=Math.sin(t*.35+i*1.8)*.05;});
    candGlows.forEach((g,i)=>{g.material.opacity=.4+.3*Math.sin(t*6+i*1.9);});
    lotusLanterns.forEach((g,i)=>{g.material.opacity=.6+.25*Math.sin(t*1.8+i*2.4);});
    lotusRings.forEach((r,i)=>{r.rotation.y+=dt*1.2*(i%2?-1:1);});
    walkers4.forEach(w=>{
      w.az+=w.sp*dt;
      const dirx=Math.sin(w.az),dirz=Math.cos(w.az);
      let rr=w.r;
      for(const [ox,oz,orr] of hallObs){
        const relx=ox,relz=oz+5.4;
        const tp=relx*dirx+relz*dirz;
        if(tp<=0)continue;
        const d2=relx*relx+relz*relz-tp*tp,omin=orr+.55;
        if(d2>=omin*omin)continue;
        const tEdge=tp+Math.sqrt(omin*omin-d2);
        if(tEdge>rr)rr=tEdge;}
      const wx=dirx*rr,wz=dirz*rr-5.4;
      const dx=wx-w.g.position.x,dz=wz-w.g.position.z;
      if(Math.hypot(dx,dz)>.001)w.g.rotation.y=Math.atan2(dx,dz);
      w.g.position.set(wx,Math.abs(Math.sin(t*5+w.ph))*.03,wz);});}
  renderer.render(scene,camera);}
animate();
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);});
console.log('scene ready');
</script>
